<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Matthew Richards" />
    <meta
      name="description"
      content="Spots social media app. This is an app for TripleTen."
    />
    <meta name="keywords" content="Social Media, Spots, TripleTen" />
    <title>Spots</title>
    <!-- <link rel="stylesheet" href="./pages/index.css" /> -->
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%= require('./src/images/Logo.svg') %>"
          alt="Spots Logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-section">
            <button class="profile__edit-avatar">
              <img
                src="#"
                alt="Profile Avatar"
                class="profile__avatar profile__avatar_hover"
              />
              <span class="profile__edit-txt">Edit Profile</span>
            </button>
          </div>
          <div class="profile__column">
            <h1 class="profile__name" id="profile-name"></h1>
            <p class="profile__description" id="profile-description"></p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%= require('./src/images/pencil.svg')%>"
                alt="Pencil icon"
                class="profile__edit-btn-pencil"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%= require('./src/images/plusIcon.svg')%>"
              alt="Plus icon"
              class="profile__edit-btn-pencil"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="template">
              <li class="card">
                <div class="card__image-container">
                  <img
                    src="<%= require('./src/images/1-photo-by-moritz-feldmann-from-pexels.jpg')%>"
                    alt="Val Thorens"
                    class="card__image"
                  />
                  <button type="button" class="card__delete-btn"></button>
                </div>
                <div class="card__content">
                  <h2 class="card__title">Val Thorens</h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2025 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <h2 class="modal__title">Edit Profile</h2>
          <button type="button" class="modal__close-btn"></button>
          <form action="submit" class="modal__form">
            <label for="profile-name-input" class="modal__label">Name</label>
            <input
              type="text"
              class="modal__input"
              id="profile-name-input"
              name="name"
              placeholder="Enter your name"
              required
              minlength="2"
              maxlength="40"
            />
            <span class="modal__error" id="profile-name-input-error"></span>
            <label for="profile-description-input" class="modal__label"
              >Description</label
            >
            <input
              type="text"
              class="modal__input"
              id="profile-description-input"
              name="description"
              placeholder="Describe yourself"
              required
              minlength="2"
              maxlength="200"
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
            <button
              type="submit"
              class="modal__submit-btn modal__submit-btn_disabled"
            >
              Save
            </button>
          </form>
        </div>
      </div>

      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <div class="modal__row">
            <h2 class="modal__title">New post</h2>
            <button type="button" class="modal__close-btn"></button>
          </div>
          <form action="submit" class="modal__form">
            <label for="image-link-input" class="modal__label"
              >Image link</label
            >
            <input
              type="url"
              class="modal__input"
              id="image-link-input"
              name="image-link"
              placeholder="Paste a link to the picture"
              required
            />
            <span class="modal__error" id="image-link-input-error"></span>

            <label for="image-caption-input" class="modal__label"
              >Caption</label
            >
            <input
              type="text"
              class="modal__input"
              id="image-caption-input"
              name="image-caption"
              placeholder="Type your caption"
              required
              minlength="2"
              maxlength="30"
            />
            <span class="modal__error" id="image-caption-input-error"></span>

            <button
              type="submit"
              class="modal__submit-btn modal__submit-btn_disabled"
            >
              Save
            </button>
          </form>
        </div>
      </div>
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <img src="#" alt="" class="modal__image" />
          <button
            type="button"
            class="modal__close-btn modal__close-btn_preview"
          ></button>
          <p class="modal__caption"></p>
        </div>
      </div>

      <div class="modal modal_edit_avatar" id="edit-avatar-modal">
        <div class="modal__container">
          <h2 class="modal__title">Edit profile avatar</h2>
          <button class="modal__close-btn modal__close-btn_preview"></button>
          <form action="submit" class="modal__form">
            <label for="profile-picture" class="modal__label"
              >Profile Picture</label
            >
            <input
              type="url"
              class="modal__input"
              id="avatar-link-input"
              placeholder="Paste the link to an image"
              name="avatar-link"
              required
            />
            <span class="modal__error" id="avatar-link-input-error"></span>
            <button
              type="submit"
              class="modal__submit-btn modal__submit-btn_disabled"
            >
              Save
            </button>
          </form>
        </div>
      </div>
      <div class="modal modal_delete_post" id="delete-post-modal">
        <div class="modal__container">
          <h3 class="modal__title modal__title_delete">
            Are you sure you want to delete this image?
          </h3>
          <button class="modal__close-btn"></button>
          <div class="modal__btn-container">
            <button class="modal__submit-btn modal__submit-btn_delete">
              Delete
            </button>
            <button class="modal__submit-btn modal__submit-btn_cancel">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
